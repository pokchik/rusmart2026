								 <p>Dr. Evgeny Khorov, Head of the Wireless Networks Lab and the Deputy Director of the Institute for Information Transmission Problems of the Russian Academy of Sciences</p>
								  <p>Abstract</p>
									<p>According to the Cisco Visual Networking Index, Wi-Fi is the most popular Internet access technology, which serves over half of global traffic. In the talk, we will focus on the two novel most important standards in the IEEE 802.11 landscape, namely 802.11ax, also known as Wi-Fi 6, which has recently appeared on the market, and 802.11be, or Wi-Fi 7, which is under active development.

We will consider how promising approaches are implemented in the future Wi-Fi standard, what and why is left beyond the scope of the standard, and how the research community can contribute to maximizing user experience in Wi-Fi networks. We discuss the peculiarities of resource allocation in 11ax networks and show how they modify the classical schedulers for wireless networks. We consider how the vision on the interference problem is changed over time and how to manage carrier sensing in dense (or sparse) environments. We demonstrate how Wi-Fi 7 supports emerging real-time applications and which revolutionary novelties of Wi-Fi 7 form a basement for further Wi-Fi evolution.
</p>
									<p>Bio</p>
									<p>EVGENY KHOROV (Senior Member, IEEE)  is currently the Head of the Wireless Networks Lab and the Deputy Director of the Institute for Information Transmission Problems of the Russian Academy of Sciences. He has led dozens of national and international projects sponsored by academic funds and industry. Being a voting member of IEEE 802.11, he has contributed to 802.11 standards with many proposals. He has authored more than 100 articles on 5G and beyond wireless systems, next-generation Wi-Fi, protocol design, and QoS-aware cross-layer optimization. He received the Russian Government Award in Science and Technology, several Best Papers Awards, and the Scopus Award Russia 2018. Many times Huawei awarded him as the Best Cooperation Project Leader. He gives tutorials and participates in panels at large IEEE events, chairs TPC of the IEEE GLOBECOM 2018 CA5GS Workshop, IEEE BLACKSEACOM 2019, and the Internet Architecture Board Workshop on Network Quality 2021. He was awarded as the Editor of the Year 2020 of Ad Hoc Networks.</p>
